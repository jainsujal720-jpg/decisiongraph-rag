[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisiongraph-rag"
version = "0.11.0"
description = "Enterprise hybrid GraphRAG product-intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "neo4j>=5.25,<6",
  "redis>=5.1,<7",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "tiktoken>=0.8,<1",
  "openai>=1.60,<3",
  "httpx>=0.27,<1",
  "pyjwt>=2.10,<3",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/decisiongraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
